name: CodeQL - Python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for Python
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze Python
        uses: github/codeql-action/analyze@v3
