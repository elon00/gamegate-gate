name: CI - fail-closed Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile every Python test source (fail on corrupted files)
        run: python -m compileall -q tests
      - name: Execute Python tests (including nonstandard filenames)
        run: python -m pytest -q tests -o python_files='*.py'
